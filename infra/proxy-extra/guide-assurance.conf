# Guide Assurance (guide-assurance.ch) — managed from /home/sam/dev/courtier, not by episto.
# Production: Next.js static export (site/out) in www/guide-assurance/, mockups kept under /maquettes-2ba87920/.
# Deploy: infra/deploy.sh. Certificates: certbot webroot /var/lib/episto-www, deploy hook reloads the proxy.
# www.guide-assurance.ch: cert + 301 to apex (22.11.2026). www.frontaliers-assurance.ch and www.primes-lamal.ch: certs + 301 (22.11.2026). leads.guide-assurance.ch: vhost to ga-leads (22.11.2026).

# Access log without IP address or user agent: no personal data (nLPD), whatever the retention of the shared proxy logs.
# Demandes de rappel : 6 par minute et par IP, vers le conteneur ga-leads.
limit_req_zone $binary_remote_addr zone=ga_demande:1m rate=6r/m;
# Assistant : 10 messages par minute et par IP (l'application ajoute 60 par 10 min, 20 par conversation et un plafond quotidien).
limit_req_zone $binary_remote_addr zone=ga_assistant:1m rate=10r/m;
log_format guide_leads '$time_iso8601 $host "$request_method $uri" $status $body_bytes_sent';

log_format guide_anon '$time_iso8601 $host "$request" $status $body_bytes_sent "$http_referer"';

# Cache-Control (rapport 09, G1). Posé une seule fois au niveau du serveur (add_header plus bas) : aucune location
# n'a besoin d'un add_header de plus, donc les en-têtes de sécurité du serveur restent hérités partout où ils l'étaient.
# HTML, RSC (.txt), sitemap, llms.txt, JSON et CSV des données : revalidés à chaque visite (ETag / Last-Modified de nginx),
# car un déploiement supprime les anciens fichiers /_next/static/ et une page en cache pointerait vers des scripts absents.
# /_next/static/ : noms à empreinte, jamais réécrits. Images sans empreinte : un jour.
map $uri $ga_cache_control {
  default                                    "no-cache";
  ~^/_next/static/                           "public, max-age=31536000, immutable";
  ~^/brand/                                  "public, max-age=2592000";
  ~*\.(?:png|jpe?g|webp|avif|svg|ico)$       "public, max-age=86400";
}

server {
  listen 80;
  server_name guide-assurance.ch frontaliers-assurance.ch primes-lamal.ch www.guide-assurance.ch www.frontaliers-assurance.ch www.primes-lamal.ch leads.guide-assurance.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name guide-assurance.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  ssl_certificate /etc/letsencrypt/live/guide-assurance.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/guide-assurance.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Headers are set at server level only: a location with its own add_header would drop them
  # (the locations that need their own headers below repeat the whole set, Cache-Control included).
  # HSTS sans includeSubDomains : autodiscover.guide-assurance.ch est un CNAME vers Microsoft 365 (Outlook), sans
  # certificat pour ce nom (CT : seuls l'apex, www. et leads. en ont). Vérifié le 23.11.2026, voir docs/decisions.md.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control $ga_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;
  # Next static export inlines its bootstrap scripts, hence 'unsafe-inline' for scripts (no user content is rendered server-side).
  # challenges.cloudflare.com : Turnstile de l'assistant (chargé seulement à l'ouverture du panneau).
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://eu.i.posthog.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  root /etc/nginx/extra.d/www/guide-assurance;
  index index.html;
  error_page 404 /404.html;

  # Mockups stay private
  location ^~ /maquettes-2ba87920/ {
    add_header X-Robots-Tag "noindex" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  # Compression (pages, scripts, données JSON du comparateur). Jamais text/event-stream : l'assistant diffuse en continu.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;
  # Module brotli chargé par l'image du proxy (episto nginx/Dockerfile.proxy) ; gzip reste pour les autres navigateurs.
  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1024;
  brotli_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

  error_page 404 /404.html;

  # Images de marque : URL versionnées (?v=…) quand elles changent. Cache-Control : map $ga_cache_control (30 jours).
  # Pas d'« expires » ici ni sous /_next/static/ : il ajouterait un second Cache-Control.
  location ^~ /brand/ {
    access_log off;
    try_files $uri =404;
  }

  location ^~ /_next/static/ {
    access_log off;
    try_files $uri =404;
  }

  # Intake : variable + resolver, nginx démarre même si ga-leads est arrêté (ne jamais écrire proxy_pass en dur).
  location = /api/demande {
    limit_except POST { deny all; }
    limit_req zone=ga_demande burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ga_leads http://ga-leads:3000;
    proxy_pass $ga_leads;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
  }

  # Assistant : réponse en flux (pas de mise en tampon), même modèle que /api/demande.
  location = /api/assistant {
    limit_except POST { deny all; }
    limit_req zone=ga_assistant burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 48k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ga_leads http://ga-leads:3000;
    proxy_pass $ga_leads;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
  }

  # Widgets intégrables (rapport 08, idée 7) : seules ces pages peuvent être affichées dans une iframe d'un autre site.
  # Pas de X-Frame-Options, frame-ancestors *. Ni GTM ni PostHog dans la CSP : les widgets ne chargent aucun traceur.
  location ^~ /widget/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control $ga_cache_control always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    try_files $uri $uri/ $uri.html =404;
  }

  # Formulaire : sans GTM ni Google, Turnstile seulement.
  location ~ ^/(demande|en/request)/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control $ga_cache_control always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://eu.i.posthog.com; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ $uri.html =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name frontaliers-assurance.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  ssl_certificate /etc/letsencrypt/live/frontaliers-assurance.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/frontaliers-assurance.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location ^~ /.well-known/acme-challenge/ { root /var/www; }
  location / { return 301 https://guide-assurance.ch/frontaliers/; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name primes-lamal.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  ssl_certificate /etc/letsencrypt/live/primes-lamal.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/primes-lamal.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location ^~ /.well-known/acme-challenge/ { root /var/www; }
  location / { return 301 https://guide-assurance.ch/assurance-maladie/comparateur/; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.guide-assurance.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  ssl_certificate /etc/letsencrypt/live/www.guide-assurance.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.guide-assurance.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  location ^~ /.well-known/acme-challenge/ { root /var/www; }
  location / { return 301 https://guide-assurance.ch$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.frontaliers-assurance.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  ssl_certificate /etc/letsencrypt/live/www.frontaliers-assurance.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.frontaliers-assurance.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location ^~ /.well-known/acme-challenge/ { root /var/www; }
  location / { return 301 https://guide-assurance.ch/frontaliers/; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.primes-lamal.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_anon;

  ssl_certificate /etc/letsencrypt/live/www.primes-lamal.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.primes-lamal.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location ^~ /.well-known/acme-challenge/ { root /var/www; }
  location / { return 301 https://guide-assurance.ch/assurance-maladie/comparateur/; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name leads.guide-assurance.ch;
  access_log /var/log/nginx/guide-assurance.access.log guide_leads;

  ssl_certificate /etc/letsencrypt/live/leads.guide-assurance.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/leads.guide-assurance.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Referrer-Policy same-origin : avec no-referrer, Chrome envoie Origin: null et le contrôle CSRF refuse tout.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control "no-store" always;

  client_max_body_size 1m;
  location ^~ /.well-known/acme-challenge/ { root /var/www; }
  location = /api/demande { return 404; }
  location = /api/assistant { return 404; }
  location / {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ga_leads http://ga-leads:3000;
    proxy_pass $ga_leads;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}
