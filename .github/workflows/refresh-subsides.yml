name: "Veille : subsides d'assurance maladie (le 1er du mois, 07:20)"

# Barèmes 2027 des subsides d'assurance maladie (site/src/data/subsides-2027.json, lus à la main dans les textes officiels) : empreinte
# de chaque source officielle, chiffres témoins, apparition de l'échelle 2027 du Valais ; alerte par e-mail. Rien n'est publié.
# Lignes en UTC : hiver puis été ; le modèle ne garde que celle qui tombe à 7 h à Zurich.
on:
  schedule:
    - cron: "20 6 1 * *"
    - cron: "20 5 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "--dry-run : relit et compare, n'écrit rien, n'envoie rien"
        type: boolean
        default: true
      args:
        description: "options (--simulate-change, --simulate-parser-failure)"
        type: string
        default: ""

# Concurrence : dans _refresh.yml (job run, groupe guide-assurance-prod partagé avec le déploiement).

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  releve:
    uses: ./.github/workflows/_refresh.yml
    with:
      dataset: subsides
      at: 7
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      args: ${{ inputs.args || '' }}
    secrets: inherit
