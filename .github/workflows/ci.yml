name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: shared/demande
      - run: npm ci
        working-directory: site
      - run: npx tsc --noEmit
        working-directory: site
      - run: npm run lint --if-present
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Données ouvertes à jour (data/csv)
        run: node --no-warnings scripts/donnees-ouvertes.mts ../data/csv && git diff --exit-code -- ../data/csv
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Contrôles SEO du HTML généré (canonical, hreflang, JSON-LD, FAQ, sitemap)
        run: npm run test:html
        working-directory: site
      - name: Aucune mention interdite dans le site généré
        run: "! grep -rli \"leman\"\"is\" site/out"
