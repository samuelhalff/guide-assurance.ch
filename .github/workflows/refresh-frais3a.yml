name: "Veille : frais 3a (le 2 du mois, 07:15)"

# Frais des comptes 3a et des solutions 3a en titres (site/src/data/frais-3a.json, relevé à la main) : empreinte de
# chaque page tarifaire et chiffres témoins, alerte par e-mail si une page change. Rien n'est publié.
# Lignes en UTC : hiver puis été ; le modèle ne garde que celle qui tombe à 7 h à Zurich.
on:
  schedule:
    - cron: "15 6 2 * *"
    - cron: "15 5 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "--dry-run : relit et compare, n'écrit rien, n'envoie rien"
        type: boolean
        default: true
      args:
        description: "options (--simulate-change, --simulate-parser-failure)"
        type: string
        default: ""

# Concurrence : dans _refresh.yml (job run, groupe guide-assurance-prod partagé avec le déploiement).

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  releve:
    uses: ./.github/workflows/_refresh.yml
    with:
      dataset: frais3a
      at: 7
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      args: ${{ inputs.args || '' }}
    secrets: inherit
