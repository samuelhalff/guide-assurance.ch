name: "Relevé : primes LAMal (06:15, chaque jour du 25.9 au 31.12, sinon le 1er)"

# Ancien crontab de sam (infra/refresh/crontab.txt). Lignes en UTC : hiver puis été ; le modèle ne garde que celle
# qui tombe à 6 h à Zurich.
on:
  schedule:
    - cron: "15 4 25-30 9 *"
    - cron: "15 5 25-30 9 *"
    - cron: "15 4 * 10-12 *"
    - cron: "15 5 * 10-12 *"
    - cron: "15 4 1 1-9 *"
    - cron: "15 5 1 1-9 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "--dry-run : relève et compare, n'écrit rien, ne publie rien, n'envoie rien"
        type: boolean
        default: true
      args:
        description: "options (--simulate-change, --simulate-parser-failure)"
        type: string
        default: ""

# Concurrence : dans _refresh.yml (job run, groupe guide-assurance-prod partagé avec le déploiement).

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  releve:
    uses: ./.github/workflows/_refresh.yml
    with:
      dataset: lamal
      at: 6
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      args: ${{ inputs.args || '' }}
    secrets: inherit
