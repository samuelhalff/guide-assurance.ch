name: Préparer le site
description: Node 22, dépendances de shared/demande et du site (npm ci), Python et ses modules pour les relevés.
inputs:
  python:
    description: installer Python 3.12, PyMuPDF et openpyxl (relevés de données)
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          site/package-lock.json
          shared/demande/package-lock.json
          data/scripts/package-lock.json
    - shell: bash
      run: |
        (cd shared/demande && npm ci --no-audit --no-fund)
        (cd site && npm ci --no-audit --no-fund)
    - if: inputs.python == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
    - if: inputs.python == 'true'
      shell: bash
      run: |
        python -m pip install --quiet pymupdf==1.27.1 openpyxl==3.1.5
        # Navigateur sans tête pour les pages des banques rendues en JavaScript (data/scripts/render_page.mjs)
        (cd data/scripts && npm ci --no-audit --no-fund && npx playwright install --with-deps --only-shell chromium)
