name: Préparer le site
description: Node 22, dépendances de shared/demande et du site (npm ci), Python et ses modules pour les relevés.
inputs:
  python:
    description: installer Python 3.12, PyMuPDF et openpyxl (relevés de données)
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          site/package-lock.json
          shared/demande/package-lock.json
    - shell: bash
      run: |
        (cd shared/demande && npm ci --no-audit --no-fund)
        (cd site && npm ci --no-audit --no-fund)
    - if: inputs.python == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - if: inputs.python == 'true'
      shell: bash
      run: python -m pip install --quiet pymupdf==1.27.1 openpyxl==3.1.5
